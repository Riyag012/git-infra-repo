apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alumni-frontend-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanishkpandey18/git-infra-repo.git'
    targetRevision: main
    path: charts/alumni-frontend
    helm:
      valueFiles:
        - ../../argocd/prod/values/frontend-prod.yaml
  destination:
    name: prod-cluster
    namespace: alumni-portal-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true