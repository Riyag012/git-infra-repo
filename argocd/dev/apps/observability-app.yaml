apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alumni-observability-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanishkpandey18/git-infra-repo.git'
    targetRevision: main
    path: charts/observability-stack
    helm:
      valueFiles:
        - ../../argocd/dev/values/observability-dev.yaml
  destination:
    name: dev-cluster 
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
