apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanishkpandey18/git-infra-repo.git'
    targetRevision: main
    path: charts/velero-agent
    helm:
      valueFiles:
        - ../../argocd/dev/values/velero-dev.yaml
  destination:
    name: dev-cluster
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
