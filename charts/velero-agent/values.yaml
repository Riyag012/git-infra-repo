velero:
  initContainers:
    - name: velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.9.0
      volumeMounts:
        - mountPath: /target
          name: plugins

  credentials:
    useSecret: true
    existingSecret: credentials-velero

  configuration:
    backupStorageLocation:
      - name: default
        provider: aws
        config:
          region: minio
          s3ForcePathStyle: true

  schedules: {}
