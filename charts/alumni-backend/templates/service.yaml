apiVersion: v1
kind: Service
metadata:
  name: alumni-backend-service
  labels:
    app: alumni-backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http-api

    #   # --- METRICS INGESTION PORT CONFIGURATION for Prometheus Operator ServiceMonitor ---
    # - port: {{ .Values.service.port }}
    #   targetPort: {{ .Values.service.targetPort }}
    #   protocol: TCP
    #   name: http-metrics
    
  selector:
    app: alumni-backend