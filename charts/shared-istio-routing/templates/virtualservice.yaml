apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: alumni-global-router
  namespace: {{ .Release.Namespace }}
spec:
  hosts:
  - "*"
  gateways:
  - alumni-shared-gateway
  http:
    # 1. API Traffic -> Backend
    - match:
      - uri:
          prefix: /api
      route:
      - destination:
          host: alumni-backend-service.{{ .Release.Namespace }}.svc.cluster.local
          port:
            number: 8000

    # 2. DOCUMENTATION TRAFFIC -> Backend (NEW)
    # This handles both /docs (MkDocs) and /docs/api-docs (Swagger)
    - match:
      - uri:
          prefix: /docs
      route:
      - destination:
          host: alumni-backend-service.{{ .Release.Namespace }}.svc.cluster.local
          port:
            number: 8000

    # 3. Authentication Traffic -> Keycloak
    - match:
      - uri:
          prefix: /auth
      route:
      - destination:
          host: keycloak-service.{{ .Release.Namespace }}.svc.cluster.local
          port:
            number: 8080
        headers:
          request:
            set:
              x-forwarded-proto: "https"
              x-forwarded-port: "443"

    # 4. Web UI Traffic -> Frontend React App (Catch-All)
    - match:
      - uri:
          prefix: /
      route:
      - destination:
          host: alumni-frontend-service.{{ .Release.Namespace }}.svc.cluster.local
          port:
            number: 80