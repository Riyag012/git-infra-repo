apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.0.0
        args: ["start-dev"]
        env:
        - name: KC_PROXY_HEADERS
          value: "xforwarded"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HOSTNAME
          value: "https://jecrconnect.xyz"

        - name: KC_HTTP_RELATIVE_PATH  # <-- ADD THIS
          value: "/auth"               # <-- ADD THIS

        # Add these two lines for the Master Admin:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: "admin"
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          value: "admin"

        # DB Variables

        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL_HOST
          value: "postgres-service"
        - name: KC_DB_URL_DATABASE
          value: "keycloak"
        - name: KC_DB_USERNAME
          valueFrom: { secretKeyRef: { name: alumni-secrets, key: POSTGRES_USER } }
        - name: KC_DB_PASSWORD
          valueFrom: { secretKeyRef: { name: alumni-secrets, key: POSTGRES_PASSWORD } }
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
spec:
  ports: [{ port: 8080, targetPort: 8080 }]
  selector: { app: keycloak }
